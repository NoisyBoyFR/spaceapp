name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-changes:
    name: Detect container source changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require image scans only for image source changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps \
            packages \
            ':(exclude)packages/run-spaceapp/**' \
            deploy/docker \
            starter-memory \
            Dockerfile \
            package-lock.json \
            scripts/build-temporal-native.mjs \
            scripts/fixtures/temporal-core-bridge-1.25.0.Cargo.lock; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  source:
    name: Source, dependencies, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Scan tracked source and introduced commits for secrets
        shell: bash
        run: |
          scanner="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$scanner"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner/archive.tar.gz" | sha256sum --check -
          tar -xzf "$scanner/archive.tar.gz" -C "$scanner"
          touch "$scanner/empty-ignore"

          # Scan every tracked source file, including the imported source.
          snapshot=$(mktemp -d "$RUNNER_TEMP/spaceapp-secret-tree.XXXXXX")
          git archive HEAD | tar -x -C "$snapshot"
          "$scanner/gitleaks" dir --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$scanner/empty-ignore" \
            --report-path "$RUNNER_TEMP/gitleaks-current.json" "$snapshot"

          # Also catch secrets introduced then removed in this repository's
          # commits. Its initial public import has separate verified provenance;
          # unrelated remote histories are not part of the candidate.
          imports=$(git log --reverse --format=%H --diff-filter=A -- PUBLIC_EXPORT_MANIFEST.json)
          import_commit="${imports%%$'\n'*}"
          test -n "$import_commit"
          git merge-base --is-ancestor "$import_commit" HEAD
          "$scanner/gitleaks" git --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$scanner/empty-ignore" \
            --log-opts="$import_commit..HEAD -m" \
            --report-path "$RUNNER_TEMP/gitleaks-introduced.json" .

      - name: Preserve redacted secret scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-reports
          path: |
            ${{ runner.temp }}/gitleaks-current.json
            ${{ runner.temp }}/gitleaks-introduced.json
          if-no-files-found: ignore

      - run: npm ci
      - name: Rebuild patched Temporal before source tests and scans
        uses: ./.github/actions/temporal-native
      - run: npm audit --audit-level=high
      - name: Install ripgrep (the file search tests run the real rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - run: npm run test:public
      - run: npm run public:export:verify

      - name: Block fixable Medium, High, and Critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-filesystem.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload blocking filesystem scan
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-filesystem.sarif

      - name: Capture all filesystem findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-full-filesystem.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize all filesystem findings
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        run: >-
          node scripts/trivy-report-summary.mjs
          --input trivy-full-filesystem.json
          --label filesystem
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full filesystem report
        if: always() && hashFiles('trivy-full-filesystem.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-filesystem
          path: trivy-full-filesystem.json
          if-no-files-found: error

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spaceapp-source.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom
          path: spaceapp-source.spdx.json
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: javascript-typescript

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Rebuild patched Temporal before CodeQL build
        uses: ./.github/actions/temporal-native
      - run: npm run build

      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3

  image:
    name: Image scan / ${{ matrix.target }}
    needs: container-changes
    if: needs.container-changes.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: spaceapp-${{ matrix.target }}:security-scan
          cache-from: type=gha,scope=security-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.target }}

      - name: Block fixable Medium, High, and Critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spaceapp-${{ matrix.target }}:security-scan
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.target }}.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload blocking image scan
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.target)) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif

      - name: Capture all image findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: spaceapp-${{ matrix.target }}:security-scan
          format: json
          output: trivy-full-${{ matrix.target }}.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize all image findings
        if: always() && hashFiles(format('trivy-full-{0}.json', matrix.target)) != ''
        run: >-
          node scripts/trivy-report-summary.mjs
          --input "trivy-full-${{ matrix.target }}.json"
          --label "${{ matrix.target }}"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full image report
        if: always() && hashFiles(format('trivy-full-{0}.json', matrix.target)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-${{ matrix.target }}
          path: trivy-full-${{ matrix.target }}.json
          if-no-files-found: error
