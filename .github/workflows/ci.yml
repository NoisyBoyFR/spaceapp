name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-quality:
    name: Sanitized public quality gates
    runs-on: ubuntu-latest
    # The full workspace suites take about 25 minutes (review F15).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify original export provenance and report public contributions
        shell: bash
        run: |
          # The manifest describes the immutable private-to-public export.
          # Later public contributions are tested in the current checkout below.
          export_commit=$(git log -1 --format=%H -- PUBLIC_EXPORT_MANIFEST.json)
          test -n "$export_commit"
          export_root="$RUNNER_TEMP/spaceapp-original-export"
          git worktree add --detach "$export_root" "$export_commit"
          node scripts/verify-export-provenance.mjs "$export_root"
          git worktree remove "$export_root"
          echo "Public contributions since export $export_commit:"
          git diff --stat "$export_commit" HEAD

      - name: Create sanitized candidate
        run: >-
          node scripts/public-export.mjs
          --output "$RUNNER_TEMP/spaceapp-public-export"

      - name: Install candidate dependencies
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm ci

      - name: Rebuild patched Temporal in the sanitized candidate
        uses: ./.github/actions/temporal-native
        with:
          working-directory: ${{ runner.temp }}/spaceapp-public-export

      - name: Install ripgrep (the file search tests run the real rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Public release tests
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run test:public

      - name: Typecheck candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run check

      - name: Build candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run build

      - name: Pack launcher candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run pack:dry-run -w run-spaceapp
