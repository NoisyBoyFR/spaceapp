name: Rustls native rebuild proof

on:
  push:
    branches:
      - codex/rustls-native-proof-20261030
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustls-native-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-proof:
    name: Rustls 0.23.46 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_BASE: 9fe6fa0afb9a2cd251cfadedae45f78598368987
      SDK_EXPECTED: 1.25.0
      RUSTUP_TOOLCHAIN: 1.94.0
      TARGET_TRIPLE: ${{ matrix.target }}
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install unchanged pinned workspace
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          test -z "$(git diff "$SOURCE_BASE" -- . ':!.github/workflows/rustls-native-proof.yml')"
          npm ci

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native compiler prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      - name: Record exact SDK source and original native artifact
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const workerRequire = require('node:module').createRequire(path.resolve('apps/worker/package.json'));
          const sdkRoot = path.dirname(workerRequire.resolve('@temporalio/core-bridge'));
          const common = require(path.join(sdkRoot, 'common.js'));
          const sdk = JSON.parse(fs.readFileSync(path.join(sdkRoot, 'package.json'), 'utf8'));
          assert.equal(sdk.version, process.env.SDK_EXPECTED);
          assert.equal(common.getPrebuiltTargetName(), process.env.TARGET_TRIPLE);
          const proof = path.join(process.env.RUNNER_TEMP, 'rustls-native-proof', 'artifacts');
          fs.mkdirSync(proof, { recursive: true });
          const hash = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const sdkPath = path.relative(process.cwd(), sdkRoot).split(path.sep).join('/');
          const receipt = {
            sourceBase: process.env.SOURCE_BASE,
            proofCommit: process.env.GITHUB_SHA,
            sdkVersion: sdk.version,
            sdkPath,
            npmSource: lock.packages[sdkPath],
            target: common.getPrebuiltTargetName(),
            originalCargoSha256: hash(path.join(sdkRoot, 'Cargo.lock')),
            originalNativeSha256: hash(common.getPrebuiltPath()),
            requestedRustls: '0.23.46',
            rustToolchain: process.env.RUSTUP_TOOLCHAIN,
          };
          fs.copyFileSync(path.join(sdkRoot, 'Cargo.lock'), path.join(proof, 'Cargo.original.lock'));
          fs.writeFileSync(path.join(proof, 'receipt.json'), JSON.stringify(receipt, null, 2));
          fs.appendFileSync(process.env.GITHUB_ENV, 'SDK_ROOT=' + sdkRoot + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PROOF_DIR=' + proof + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'CARGO_TARGET_DIR=' + path.join(process.env.RUNNER_TEMP, 'rustls-native-target') + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE
          rustc +1.94.0 -Vv
          protoc --version

      - name: Resolve Rustls 0.23.46 without changing features or application code
        run: |
          cd "$SDK_ROOT"
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$TARGET_TRIPLE" > "$PROOF_DIR/metadata.original.json"
          cargo +1.94.0 update -p rustls@0.23.36 --precise 0.23.46
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$TARGET_TRIPLE" > "$PROOF_DIR/metadata.patched.json"
          cargo +1.94.0 tree --locked --target "$TARGET_TRIPLE" -i rustls@0.23.46 > "$PROOF_DIR/rustls-dependents.txt"
          cargo +1.94.0 tree --locked --target "$TARGET_TRIPLE" -e features -i rustls@0.23.46 > "$PROOF_DIR/rustls-features.txt"
          cp Cargo.lock "$PROOF_DIR/Cargo.patched.lock"
          rustc +1.94.0 -Vv > "$PROOF_DIR/rustc-version.txt"
          protoc --version > "$PROOF_DIR/protoc-version.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(process.env.PROOF_DIR, name), 'utf8'));
          const before = read('metadata.original.json');
          const after = read('metadata.patched.json');
          const rustlsBefore = before.packages.filter((p) => p.name === 'rustls');
          const rustlsAfter = after.packages.filter((p) => p.name === 'rustls');
          assert.deepEqual(rustlsBefore.map((p) => p.version), ['0.23.36']);
          assert.deepEqual(rustlsAfter.map((p) => p.version), ['0.23.46']);
          const features = (meta, pkg) => meta.resolve.nodes.find((n) => n.id === pkg.id).features.slice().sort();
          assert.deepEqual(features(after, rustlsAfter[0]), features(before, rustlsBefore[0]));
          console.log('Rustls 0.23.46 resolved with identical feature selection');
          NODE

      - name: Preserve resolved lock and graph before native compilation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustls-native-resolution-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/rustls-native-proof/artifacts/Cargo.patched.lock
            ${{ runner.temp }}/rustls-native-proof/artifacts/metadata.patched.json
            ${{ runner.temp }}/rustls-native-proof/artifacts/rustls-dependents.txt
            ${{ runner.temp }}/rustls-native-proof/artifacts/rustls-features.txt
            ${{ runner.temp }}/rustls-native-proof/artifacts/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Compile the real Neon NAPI bridge from the locked source
        timeout-minutes: 45
        run: |
          cd "$SDK_ROOT"
          cargo +1.94.0 build --release --locked --target "$TARGET_TRIPLE" \
            --message-format=json-render-diagnostics > "$PROOF_DIR/compiler-artifacts.jsonl"
          install -m 0755 "$CARGO_TARGET_DIR/$TARGET_TRIPLE/release/libtemporal_sdk_typescript_bridge.so" \
            "$SDK_ROOT/releases/$TARGET_TRIPLE/index.node"
          cp "$SDK_ROOT/releases/$TARGET_TRIPLE/index.node" "$PROOF_DIR/index.node"
          ldd "$PROOF_DIR/index.node" > "$PROOF_DIR/native-dependencies.txt"

      - name: Prove the new binary is loaded and starts the public SDK runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const workerRequire = require('node:module').createRequire(path.resolve('apps/worker/package.json'));
          const sdkRoot = path.dirname(workerRequire.resolve('@temporalio/core-bridge'));
          const common = require(path.join(sdkRoot, 'common.js'));
          const file = path.join(process.env.PROOF_DIR, 'receipt.json');
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
          const hash = (name) => crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex');
          receipt.patchedCargoSha256 = hash(path.join(sdkRoot, 'Cargo.lock'));
          receipt.patchedNativeSha256 = hash(common.getPrebuiltPath());
          assert.notEqual(receipt.patchedNativeSha256, receipt.originalNativeSha256);
          assert.notEqual(receipt.patchedCargoSha256, receipt.originalCargoSha256);
          const artifacts = fs.readFileSync(path.join(process.env.PROOF_DIR, 'compiler-artifacts.jsonl'), 'utf8')
            .trim().split('\n').map((line) => JSON.parse(line));
          assert.ok(artifacts.some((item) => item.reason === 'compiler-artifact' &&
            item.target.name === 'rustls' && item.package_id.includes('0.23.46')));
          assert.ok(artifacts.some((item) => item.reason === 'compiler-artifact' &&
            item.target.name === 'temporal_sdk_typescript_bridge' && item.target.kind.includes('cdylib')));
          require(common.getPrebuiltPath());
          workerRequire('@temporalio/core-bridge');
          const { Runtime } = workerRequire('@temporalio/worker');
          Runtime.instance().shutdown().then(() => {
            receipt.nativeAddonLoaded = true;
            receipt.publicRuntimeStartedAndStopped = true;
            fs.writeFileSync(file, JSON.stringify(receipt, null, 2));
            console.log(JSON.stringify(receipt, null, 2));
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Build prerequisites and typecheck
        run: npm run check

      - name: Exercise all 39 sandbox and replay cases on the rebuilt binary
        timeout-minutes: 3
        run: >-
          npm test -w @space/worker --
          tests/workflow-core-sandbox.test.ts
          tests/workflow-supervisor-sandbox.test.ts
          tests/workflow-replay.test.ts

      - name: Preserve compilation provenance and real native artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustls-native-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/rustls-native-proof/artifacts
          if-no-files-found: warn
          retention-days: 7
